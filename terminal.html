// --- helpers ---
string ExtractJsonString(string json, string key)
{
   string pattern = "\\""+key+"\\"\\s*:\\s*\\"([^\\"]+)\\"";
   // fallback simple search
   int pos = StringFind(json, "\\""+key+"\\"");
   if(pos<0) return "";
   int colon = StringFind(json, ":", pos);
   if(colon<0) return "";
   int q1 = StringFind(json, "\\"", colon+1);
   if(q1<0) return "";
   // check if value is quoted
   int q2 = StringFind(json, "\\"", q1+1);
   string between = StringSubstr(json, q1+1, q2-q1-1);
   // if numeric without quotes, between will contain { or number
   if(StringFind(between, "{")>=0 || StringFind(between, "}")>=0) 
   {
      // try numeric extract
      int comma = StringFind(json, ",", colon);
      int brace = StringFind(json, "}", colon);
      int end = (comma>0 && comma<brace) ? comma : brace;
      string raw = StringSubstr(json, colon+1, end-colon-1);
      StringTrimLeft(raw); StringTrimRight(raw);
      StringReplace(raw, "\\"", "");
      return raw;
   }
   return between;
}

double ExtractJsonDouble(string json, string key)
{
   string s = ExtractJsonString(json, key);
   if(s=="") return 0;
   return StringToDouble(s);
}
